[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-framework-platform"
version = "0.9.0"
description = "Framework-first governed enterprise model investigation platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{ name = "Mrinmoy" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain-core==1.5.5",
  "langgraph==1.2.11",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "pyjwt[crypto]==2.13.0",
  "temporalio[opentelemetry,pydantic]==1.31.0",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
connectors = [
  "kubernetes==36.0.3",
]
framework-observability = [
  "langfuse==4.14.4",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]
postgres = [
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary,pool]==3.3.4",
]
model-providers = [
  "openai==3.1.0",
  "anthropic==0.122.0",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "httpx2==2.10.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[project.scripts]
aegis-framework = "aegis_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_framework"]

[tool.uv]
required-version = "==0.12.5"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "DTZ",
  "E",
  "F",
  "I",
  "PERF",
  "PT",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["DTZ001", "S101", "S105", "S106"]
"tools/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["aegis_framework"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["aegis_framework"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=aegis_framework",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
  "postgres: requires AEGIS_TEST_POSTGRES_ADMIN_DSN and AEGIS_TEST_POSTGRES_RUNTIME_DSN",
  "keycloak: requires AEGIS_TEST_KEYCLOAK_TOKEN and local Keycloak configuration",
  "temporal: requires AEGIS_TEST_TEMPORAL_ADDRESS or a preinstalled Temporal CLI",
]

[tool.coverage.run]
branch = true
source = ["aegis_framework"]
omit = [
  "src/aegis_framework/durable_postgres.py",
  "src/aegis_framework/evidence_postgres.py",
  "src/aegis_framework/model_postgres.py",
  "src/aegis_framework/postgres.py",
  "src/aegis_framework/temporal.py",
  "src/aegis_framework/evidence_temporal.py",
  "src/aegis_framework/orchestration_postgres.py",
  "src/aegis_framework/remediation_postgres.py",
  "src/aegis_framework/remediation_temporal.py",
  "src/aegis_framework/sandbox_postgres.py",
  "src/aegis_framework/sandbox_temporal.py",
  "src/aegis_framework/memory_postgres.py",
  "src/aegis_framework/memory_temporal.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
