name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"
  NODE_VERSION: "24.15.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: make lint

  type:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: make type

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.15", "3.14.7"]
    env:
      LANGGRAPH_STRICT_MSGPACK: "true"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: make test

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Generate ephemeral local database credentials
        run: |
          echo "AEGIS_POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AEGIS_POSTGRES_RUNTIME_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: uv sync --locked --all-extras
      - run: docker compose --profile durable up --detach postgres
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U aegis_admin -d aegis; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Run PostgreSQL isolation tests
        env:
          AEGIS_TEST_POSTGRES_ADMIN_DSN: postgresql://aegis_admin:${{ env.AEGIS_POSTGRES_ADMIN_PASSWORD }}@127.0.0.1:55432/aegis
          AEGIS_TEST_POSTGRES_RUNTIME_DSN: postgresql://aegis_app:${{ env.AEGIS_POSTGRES_RUNTIME_PASSWORD }}@127.0.0.1:55432/aegis
        run: uv run pytest -m postgres --no-cov
      - if: always()
        run: docker compose --profile durable down --volumes

  temporal-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Generate ephemeral local database credentials
        run: |
          echo "AEGIS_POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AEGIS_POSTGRES_RUNTIME_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: uv sync --locked --all-extras
      - run: docker compose --profile temporal up --detach postgres temporal
      - name: Wait for Temporal
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T temporal \
              tctl --address temporal:7233 cluster health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs temporal postgres
          exit 1
      - name: Run Temporal recovery and replay tests
        env:
          AEGIS_TEST_TEMPORAL_ADDRESS: 127.0.0.1:57233
        run: uv run pytest -m temporal --no-cov
      - if: always()
        run: docker compose --profile temporal down --volumes

  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: make eval

  eval-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate:
          - eval-safety
          - eval-adversarial
          - eval-recovery
          - eval-baseline
          - eval-meta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: make ${{ matrix.gate }}

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: make docs
      - run: make compose-config

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run bandit -q -r src
      - run: uv run pip-audit --progress-spinner=off --timeout=60 --cache-dir=.cache/pip-audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  operator-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked --all-extras
      - run: npm install --global npm@11.12.1
      - run: npm --prefix ui ci --ignore-scripts
      - run: make frontend-ci
      - run: npm --prefix ui exec -- playwright install --with-deps chromium
      - run: make frontend-e2e

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull --tag aegis-framework-platform:ci .
      - name: Verify runtime user and import
        run: |
          test "$(docker run --rm --entrypoint id aegis-framework-platform:ci -u)" = "10001"
          docker run --rm --entrypoint python aegis-framework-platform:ci \
            -c "from aegis_framework.api import app; assert app.title == 'Aegis Framework Platform'"
