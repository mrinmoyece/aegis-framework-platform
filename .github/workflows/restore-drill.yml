name: Restore and failover evidence

on:
  pull_request:
    paths:
      - ".github/workflows/restore-drill.yml"
      - "migrations/**"
      - "src/aegis_framework/production.py"
      - "tests/test_production_layer14.py"
      - "tools/restore_db_verify.py"
      - "tools/restore_drill.py"
      - "tools/restore_drill.sh"
  push:
    branches: [master]
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uv sync --locked --all-extras
      - run: uv run python tools/restore_drill.py --output build/restore-drill.json
      - run: make restore-drill-db
      - run: uv run pytest tests/test_production_layer14.py tests/test_temporal.py --no-cov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layer14-restore-drill
          path: |
            build/restore-drill.json
            build/restore-drill-db.json
          if-no-files-found: error
          retention-days: 30
