global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    deployment: local-qualification

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: aegis-app
    metrics_path: /metrics
    static_configs:
      - targets: [app:8000]
  - job_name: aegis-otel-collector
    static_configs:
      - targets: [otel-collector:9464]
