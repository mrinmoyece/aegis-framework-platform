global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    deployment: local-qualification

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  # The OTel collector re-exports the application's /metrics endpoint via its
  # built-in Prometheus exporter, so scraping the app directly would create
  # duplicate series with different labels.  Only collect from the collector.
  - job_name: aegis-otel-collector
    static_configs:
      - targets: [otel-collector:9464]
