extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
  prometheus:
    config:
      scrape_configs:
        - job_name: aegis-application
          scrape_interval: 15s
          static_configs:
            - targets: [app:8000]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/redact:
    actions:
      - key: tenant_id
        action: delete
      - key: actor_id
        action: delete
      - key: user_id
        action: delete
      - key: request_id
        action: delete
      - key: run_id
        action: delete
      - key: incident_id
        action: delete
      - key: evidence_locator
        action: delete
      - key: prompt
        action: delete
      - key: completion
        action: delete
      - key: authorization
        action: delete
      - key: cookie
        action: delete
  # Broad regex-based redaction for any attribute whose name pattern suggests
  # PII, credentials, or tenant-identifying material that slips past the above
  # exact-key list (e.g. vendor-injected attributes or future attribute names).
  transform/redact_sensitive:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_matching_keys(attributes, "(?i).*(token|secret|password|credential|api_key|private_key|auth|bearer|session|cookie|jwt|ssn|dob|email|phone|credit_card|cvv|iban).*")
          - delete_matching_keys(attributes, "(?i)^http\\.request\\.header\\..*")
          - delete_matching_keys(attributes, "(?i)^http\\.response\\.header\\..*")
          - delete_matching_keys(attributes, "(?i).*\\.tenant_id$")
          - delete_matching_keys(attributes, "(?i).*\\.actor_id$")
    metric_statements:
      - context: datapoint
        statements:
          - delete_matching_keys(attributes, "(?i).*(token|secret|password|credential|api_key|private_key|auth|bearer|session|cookie|jwt).*")
  filter/allow_aegis:
    error_mode: ignore
    traces:
      span:
        - 'not IsMatch(name, "^aegis\\.[a-z0-9.]+$")'
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: false
  otlphttp/optional_trace_backend:
    endpoint: ${env:AEGIS_OTLP_TRACE_ENDPOINT}
    headers:
      Authorization: ${env:AEGIS_OTLP_TRACE_AUTHORIZATION}
    tls:
      insecure: false
      min_version: "1.2"
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1024
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 60s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact_sensitive, filter/allow_aegis, batch]
      exporters: [otlphttp/optional_trace_backend]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, attributes/redact, transform/redact_sensitive, batch]
      exporters: [prometheus]
