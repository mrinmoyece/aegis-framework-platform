apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-sandbox-job
  namespace: aegis-sandbox
automountServiceAccountToken: false
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
handler: kata-qemu
scheduling:
  nodeSelector:
    aegis.io/sandbox-runtime: kata
  tolerations:
    - key: aegis.io/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
overhead:
  podFixed:
    cpu: 250m
    memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-capacity
  namespace: aegis-sandbox
spec:
  hard:
    count/jobs.batch: "200"
    count/pods: "200"
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-bounds
  namespace: aegis-sandbox
spec:
  limits:
    - type: Container
      min: {cpu: 100m, memory: 128Mi}
      max: {cpu: "4", memory: 8Gi}
      defaultRequest: {cpu: 250m, memory: 512Mi}
      default: {cpu: "1", memory: 1Gi}
    - type: Pod
      max: {cpu: "4", memory: 8Gi}

