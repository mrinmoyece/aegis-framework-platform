apiVersion: v1
kind: Service
metadata:
  name: aegis-api
  namespace: aegis-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8000, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-operator
  namespace: aegis-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: operator
  ports:
    - {name: http, port: 8000, targetPort: http, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  namespace: aegis-system
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
spec:
  ingressClassName: nginx-internal
  tls:
    - hosts: [aegis.example.invalid]
      secretName: aegis-ingress-tls
  rules:
    - host: aegis.example.invalid
      http:
        paths:
          - path: /operator
            pathType: Prefix
            backend:
              service: {name: aegis-operator, port: {name: http}}
          - path: /mcp
            pathType: Prefix
            backend:
              service: {name: aegis-protocol-gateway, port: {name: protocol}}
          - path: /a2a
            pathType: Prefix
            backend:
              service: {name: aegis-protocol-gateway, port: {name: protocol}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: aegis-api, port: {name: http}}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-protocol-gateway
  namespace: aegis-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: protocol-gateway
  ports:
    - {name: protocol, port: 8001, targetPort: protocol, protocol: TCP}
