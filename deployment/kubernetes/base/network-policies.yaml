apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: aegis-system}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: aegis-sandbox}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: aegis-system}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingress-api-operator, namespace: aegis-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, operator, protocol-gateway]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              aegis.io/boundary: ingress
          podSelector:
            matchLabels:
              aegis.io/role: ingress-controller
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8001}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: egress-postgresql-pgvector, namespace: aegis-system}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {aegis.io/boundary: data}
          podSelector:
            matchLabels: {aegis.io/role: postgres-proxy}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: egress-temporal-frontend, namespace: aegis-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          [outbox, reconciler, investigation, cognitive, evidence, remediation, memory, sandbox, protocol, protocol-gateway]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {aegis.io/boundary: temporal}
          podSelector:
            matchLabels: {aegis.io/role: temporal-private-endpoint}
      ports:
        - {protocol: TCP, port: 7233}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: egress-oidc, namespace: aegis-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, operator, protocol]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {aegis.io/boundary: identity}
          podSelector:
            matchLabels: {aegis.io/role: oidc-proxy}
      ports:
        - {protocol: TCP, port: 8443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: egress-approved-providers-connectors, namespace: aegis-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
