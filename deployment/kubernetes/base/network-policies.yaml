---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: egress-otlp, namespace: aegis-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [otel]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: otel}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingress-otlp, namespace: aegis-system}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: otel}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: otel-upstream, namespace: aegis-system}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: otel}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {aegis.io/boundary: telemetry}
          podSelector:
            matchLabels: {aegis.io/role: otlp-private-endpoint}
      ports:
        - {protocol: TCP, port: 4318}
