---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: egress-approved-protocol-peers, namespace: aegis-system}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [protocol, protocol-gateway]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {aegis.io/boundary: egress}
          podSelector:
            matchLabels: {aegis.io/role: protocol-peer-proxy}
      ports:
